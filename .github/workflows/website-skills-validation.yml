name: Website skills validation

on:
  push:
    branches: [ci/website-skill-validation]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-skill-sources
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Source revision
        shell: bash
        run: git rev-parse HEAD
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only f6c882ad77d109e1b079f4a74a72832eaabac586 HEAD -- '*.go')
          gofmt -d $files
          test -z "$(gofmt -l $files)"
      - name: Vet
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then go vet -tags nogui ./...; else go vet ./...; fi
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            go build -tags nogui -o "$RUNNER_TEMP/magpie"
          else
            go build -o "$RUNNER_TEMP/magpie"
          fi
      - name: Website skills regressions
        shell: bash
        run: |
          set -euo pipefail
          go_path=$(go env GOPATH)
          go_mod_cache=$(go env GOMODCACHE)
          go_build_cache=$(go env GOCACHE)
          test_home=$(mktemp -d)
          trap 'chmod -R u+w "$test_home"; rm -rf "$test_home"' EXIT
          env HOME="$test_home" USERPROFILE="$test_home" GOPATH="$go_path" GOMODCACHE="$go_mod_cache" GOCACHE="$go_build_cache" go test -tags nogui -count=1 -timeout 10m ./internal/library -run '^TestWellKnown' -v
      - name: Website skills race checks
        if: runner.os == 'Linux'
        shell: bash
        run: go test -race -tags nogui -count=1 -timeout 10m ./internal/library -run '^TestWellKnown' -v
      - name: Full Go suite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go_path=$(go env GOPATH)
          go_mod_cache=$(go env GOMODCACHE)
          go_build_cache=$(go env GOCACHE)
          test_home=$(mktemp -d)
          trap 'chmod -R u+w "$test_home"; rm -rf "$test_home"' EXIT
          env HOME="$test_home" USERPROFILE="$test_home" GOPATH="$go_path" GOMODCACHE="$go_mod_cache" GOCACHE="$go_build_cache" go test -tags nogui -count=1 -timeout 45m ./...

  live:
    name: live Uizze source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-skill-sources
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Discover and install the reported source in an isolated home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-website-probe
          python3 - <<'PY'
          from pathlib import Path
          Path("live-website-probe/main.go").write_text('''package main
          import (
            "encoding/json"
            "fmt"
            "io/fs"
            "os"
            "path/filepath"
            "github.com/yetone/magpie/internal/library"
          )
          func main() {
            const address = "https://uizze.sh/"
            p, err := library.ProbeSkills("npx skills add " + address)
            if err != nil { fmt.Fprintln(os.Stderr, err); os.Exit(1) }
            paths := []string{}
            for _, c := range p.Candidates { paths = append(paths, c.Path) }
            if p.Kind != "well-known" || len(paths) == 0 { fmt.Fprintln(os.Stderr, "no website skills discovered"); os.Exit(1) }
            r, err := library.InstallSkills("npx skills add " + address, paths, []string{})
            if err != nil { fmt.Fprintln(os.Stderr, err); os.Exit(1) }
            files := map[string]int{}
            for _, name := range r.Installed {
              err := filepath.WalkDir(library.SkillPath(name), func(_ string, d fs.DirEntry, err error) error {
                if err != nil { return err }
                if !d.IsDir() { files[name]++ }
                return nil
              })
              if err != nil { fmt.Fprintln(os.Stderr, err); os.Exit(1) }
            }
            json.NewEncoder(os.Stdout).Encode(map[string]any{"source": address, "kind": p.Kind, "installed": r.Installed, "files": files})
          }
          ''', encoding="utf-8")
          PY
          go_path=$(go env GOPATH)
          go_mod_cache=$(go env GOMODCACHE)
          go_build_cache=$(go env GOCACHE)
          test_home=$(mktemp -d)
          trap 'chmod -R u+w "$test_home"; rm -rf "$test_home"' EXIT
          git rev-parse HEAD
          env HOME="$test_home" USERPROFILE="$test_home" XDG_CONFIG_HOME="$test_home/.config" XDG_STATE_HOME="$test_home/.state" GOPATH="$go_path" GOMODCACHE="$go_mod_cache" GOCACHE="$go_build_cache" go run -tags nogui ./live-website-probe
